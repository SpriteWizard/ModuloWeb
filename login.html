<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm" action="page.html" method="post">
            
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="Ingrese su correo electrónico" required>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
            </div>
            
            <div id="error-message" style="color: red; margin-bottom: 10px; display: none;">
                Credenciales incorrectas. Intente nuevamente.
            </div>
            
            <button type="submit">Iniciar Sesión</button>
            
            <a class="new-users-link" href="newtoys.html">Nuevo usuario</a>

        </form>
    </div>

    <script>
        // Credenciales hardcodeadas
        const VALID_EMAIL = "admin@ejemplo.com";
        const VALID_PASSWORD = "123456";

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevenir el envío del formulario
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            let isValid = false;

            // Validar credenciales hardcodeadas
            if (email === VALID_EMAIL && password === VALID_PASSWORD) {
                isValid = true;
            }

            // Validar contra usuario registrado en localStorage
            const registeredUser = localStorage.getItem('registeredUser');
            if (registeredUser) {
                const userData = JSON.parse(registeredUser);
                if (email === userData.email && password === userData.password) {
                    isValid = true;
                }
            }
            
            if (isValid) {
                // Credenciales correctas - crear sesión con token
                const sessionToken = {
                    user: email,
                    timestamp: new Date().getTime(),
                    isAuthenticated: true
                };
                localStorage.setItem('userSession', JSON.stringify(sessionToken));
                
                console.log('Login exitoso para:', email);
                console.log('Token de sesión creado:', sessionToken);
                
                window.location.href = 'page.html';
            } else {
                // Credenciales incorrectas - mostrar mensaje de error
                errorMessage.style.display = 'block';
            }
        });
    </script>

</body>
</html>
