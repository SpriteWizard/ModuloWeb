<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body">
    <div id="header-container"></div>

    <div class="page-content">
        <h1>Pokédex</h1>

        <!-- Filtros: nombre, id y tipo -->
        <div class="pokedex-filters">
            <input type="text" id="filter-name" placeholder="Buscar por nombre..." oninput="applyFilters()" />
            <input type="text" id="filter-id" placeholder="Buscar por #ID..." oninput="applyFilters()" />
            <select id="filter-type" onchange="applyFilters()">
                <option value="">Todos los tipos</option>
                <option value="grass">Grass</option>
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="flying">Flying</option>
                <option value="poison">Poison</option>
                <option value="bug">Bug</option>
                <option value="normal">Normal</option>
                <option value="electric">Electric</option>
                <option value="ground">Ground</option>
                <option value="fairy">Fairy</option>
                <option value="fighting">Fighting</option>
                <option value="psychic">Psychic</option>
                <option value="rock">Rock</option>
                <option value="ghost">Ghost</option>
                <option value="ice">Ice</option>
                <option value="dragon">Dragon</option>
                <option value="dark">Dark</option>
                <option value="steel">Steel</option>
            </select>
        </div>

        <!-- Las tarjetas -->
        <div class="pokedex-grid" id="pokedex-grid">
            <div class="loading"><div class="spinner"></div>Cargando Pokédex...</div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="app.js"></script>
</body>
</html>
