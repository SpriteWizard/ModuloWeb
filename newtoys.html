<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>New Account</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<div class="login-container">
		<h2>Crear cuenta</h2>
		<form action="page.html" method="post">

			<div class="input-group">
				<label for="full-name">Nombre completo</label>
				<input type="text" id="full-name" name="full_name" placeholder="Ingrese su nombre completo" required>
			</div>

			<div class="input-group">
				<label for="email">Correo Electrónico</label>
				<input type="email" id="email" name="email" placeholder="Ingrese su correo electrónico" required>
			</div>

			<div class="input-group">
				<label for="username">Usuario</label>
				<input type="text" id="username" name="username" placeholder="Elija un nombre de usuario" required>
			</div>

			<div class="input-group">
				<label for="phone">Teléfono</label>
				<input type="tel" id="phone" name="phone" placeholder="Ingrese su número de teléfono" required>
			</div>

			<div class="input-group">
				<label for="password">Contraseña</label>
				<input type="password" id="password" name="password" placeholder="Cree una contraseña" required>
			</div>

			<div class="input-group">
				<label for="confirm-password">Confirmar Contraseña</label>
				<input type="password" id="confirm-password" name="confirm_password" placeholder="Repita su contraseña" required>
			</div>

			<button type="submit">Crear cuenta</button>

		</form>
	</div>

</body>
</html>
